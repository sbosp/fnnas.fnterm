<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function () {
            var p = location.pathname.replace(/\/index\.html$/i, "").replace(/\/+$/, "");
            document.write('<base href="' + (p || "") + '/">');
        })();
    </script>
    <title>fnTerm</title>
    <link rel="stylesheet" href="vendor/xterm.css">
    <style>
        :root {
            --bg: #1d1f21;
            --bar: #2b2e33;
            --bar-border: #3a3d42;
            --fg: #c5c8c6;
            --accent: #57a6ff;
            --green: #6ac46a;
            --red: #e06c75;
            --amber: #e5c07b;
            --tab-active: #3a3d42;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
        }

        #topbar {
            height: 38px;
            flex: 0 0 38px;
            background: var(--bar);
            border-bottom: 1px solid var(--bar-border);
            display: flex;
            align-items: center;
            padding: 0 14px;
            gap: 10px;
            user-select: none;
            -webkit-app-region: drag;
        }

        .dots {
            display: flex;
            gap: 8px;
            margin-right: 6px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot.r {
            background: #ff5f57;
        }

        .dot.y {
            background: #febc2e;
        }

        .dot.g {
            background: #28c840;
        }

        #title {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: .3px;
            color: #e6e6e6;
        }

        #title span {
            color: var(--accent);
        }

        #status {
            margin-left: auto;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #9aa0a6;
        }

        #status .led {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--amber);
            box-shadow: 0 0 6px currentColor;
            color: var(--amber);
            transition: all .2s;
        }

        #status.online .led {
            background: var(--green);
            color: var(--green);
        }

        #status.offline .led {
            background: var(--red);
            color: var(--red);
        }

        .btn {
            -webkit-app-region: no-drag;
            cursor: pointer;
            background: transparent;
            border: 1px solid var(--bar-border);
            color: var(--fg);
            border-radius: 6px;
            font-size: 12px;
            padding: 4px 10px;
            transition: all .15s;
        }

        .btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ========== 横向Tab栏布局（核心修改） ========== */
        #tabs-bar {
            height: 36px;
            flex: 0 0 36px;
            background: var(--bar);
            border-bottom: 1px solid var(--bar-border);
            display: flex;
            align-items: center;
            padding: 0 8px;
            gap: 8px;
            -webkit-app-region: no-drag;
        }

        /* Tab滚动容器：占满剩余宽度，横向滚动 */
        .tabs-scroll-wrap {
            flex: 1;
            overflow-x: auto;
            overflow-y: hidden;
            height: 100%;
            display: flex;
            align-items: center;
            /* 隐藏滚动条 */
            scrollbar-width: none;
        }

        .tabs-scroll-wrap::-webkit-scrollbar {
            height: 3px;
        }

        .tabs-scroll-wrap::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 3px;
        }

        /* Tab列表：横向不换行 */
        #tabs-container {
            display: flex;
            gap: 4px;
            white-space: nowrap;
            padding: 0 4px;
        }

        /* 右侧固定按钮区域 */
        .tabs-right-ops {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #new-tab-btn {
            width: 26px;
            height: 26px;
            border-radius: 6px;
            border: 1px solid var(--bar-border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            color: var(--fg);
            transition: all .15s;
        }

        #new-tab-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Tab标签样式 */
        .tab-item {
            height: 28px;
            min-width: 110px;
            max-width: 180px;
            background: var(--bar);
            border: 1px solid var(--bar-border);
            border-bottom: none;
            border-radius: 6px 6px 0 0;
            padding: 0 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all .15s;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 12px;
            flex-shrink: 0;
        }

        .tab-item.active {
            background: var(--tab-active);
            border-color: var(--accent);
            color: var(--accent);
        }

        .tab-item:hover {
            background: var(--tab-active);
        }

        .tab-close {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: var(--fg);
            margin-left: 6px;
        }

        .tab-close:hover {
            background: var(--red);
            color: #fff;
        }

        /* 终端容器 */
        #term-container {
            flex: 1 1 auto;
            overflow: hidden;
        }

        .term-wrap {
            width: 100%;
            height: 100%;
            padding: 8px 10px 10px;
            display: none;
            overflow: hidden;
            /* 新增：强制继承父级尺寸 */
            box-sizing: border-box;
            position: relative;
        }

        .term-wrap.active {
            display: block;
        }

        .terminal {
            width: 100%;
            height: 100%;
        }

        .xterm-viewport::-webkit-scrollbar {
            width: 10px;
        }

        .xterm-viewport::-webkit-scrollbar-thumb {
            background: #44474d;
            border-radius: 5px;
        }
    </style>
</head>
<body>
<!-- 横向Tab栏结构：滚动Tab区 + 右侧固定新增按钮 -->
<div id="tabs-bar">
    <div class="tabs-scroll-wrap">
        <div id="tabs-container"></div>
    </div>
    <div class="tabs-right-ops">
        <div id="status"><i class="led"></i><span id="status-text">连接中…</span></div>
        <button class="btn" id="btn-clear" title="清屏">清屏</button>
        <button class="btn" id="btn-reconnect" title="重新连接">重连</button>
        <button id="new-tab-btn" title="新建终端标签">+</button>
    </div>
</div>

<div id="term-container"></div>

<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script>
    (function () {
        "use strict";
        const tabs = new Map();
        let activeTabId = null;
        const prefix = location.pathname.replace(/\/index\.html$/i, "").replace(/\/+$/, "");
        const wsScheme = location.protocol === "https:" ? "wss:" : "ws:";

        async function closeSession(sid) {
            try {
                await fetch(`${prefix}/api/sessions/${sid}/close`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'}
                });
            } catch (e) {
                console.error('关闭会话失败:', e);
            }
        }

        class TerminalTab {
            constructor() {
                this.sid = 'tab_' + Math.random().toString(36).substr(2, 9);
                this.term = null;
                this.fitAddon = new FitAddon.FitAddon();
                this.ws = null;
                this.resizeTimer = null;
                this.heartbeatTimer = null;
                this.connectTimer = null;

                this.createTabElement();
                this.createTermElement();
                this.initTerminal();
                this.connect();
            }

            createTabElement() {
                const tabEl = document.createElement('div');
                tabEl.className = 'tab-item';
                tabEl.dataset.sid = this.sid;
                tabEl.innerHTML = `
          <span class="tab-title">终端 ${this.sid.slice(-4)}</span>
          <span class="tab-close">×</span>
        `;
                tabEl.addEventListener('click', (e) => {
                    if (e.target.classList.contains('tab-close')) return;
                    this.activate();
                });
                tabEl.querySelector('.tab-close').addEventListener('click', async (e) => {
                    e.stopPropagation();
                    await closeSession(this.sid);
                    if (this.ws) this.ws.close();
                    if (this.term) this.term.dispose();
                    this.tabElement.remove();
                    this.termElement.remove();
                    tabs.delete(this.sid);
                    if (activeTabId === this.sid) {
                        const firstTab = Array.from(tabs.values())[0];
                        if (firstTab) firstTab.activate();
                        else {
                            document.getElementById('status-text').textContent = '无活跃终端';
                            activeTabId = null;
                        }
                    }
                });
                this.tabElement = tabEl;
                document.getElementById('tabs-container').appendChild(tabEl);
            }

            createTermElement() {
                const termWrap = document.createElement('div');
                termWrap.className = 'term-wrap';
                termWrap.dataset.sid = this.sid;
                const terminalEl = document.createElement('div');
                terminalEl.className = 'terminal';
                termWrap.appendChild(terminalEl);
                this.termElement = termWrap;
                this.terminalEl = terminalEl;
                document.getElementById('term-container').appendChild(termWrap);
            }

            initTerminal() {
                if (typeof Terminal === "undefined") {
                    this.terminalEl.innerHTML = `
            <div style="color:#e06c75;font-family:monospace;font-size:13px;line-height:1.6;padding:16px;">
              [fnTerm] xterm.js 加载失败<br>
              路径: ${prefix}/vendor/xterm.js
            </div>
          `;
                    return;
                }
                this.term = new Terminal({
                    cursorBlink: true,
                    fontFamily: 'Menlo, Monaco, "DejaVu Sans Mono", "Courier New", monospace',
                    fontSize: 14,
                    lineHeight: 1.1,
                    scrollback: 10000,
                    allowProposedApi: true,
                    theme: {
                        background: "#000000", foreground: "#00ff24", cursor: "#bbbbbb",
                        cursorAccent: "#ffffff", selectionBackground: "#3a4a5e",
                        black: "#000000", red: "#cc6666", green: "#b5bd68", yellow: "#f0c674",
                        blue: "#81a2be", magenta: "#b294bb", cyan: "#8abeb7", white: "#c5c8c6",
                        brightBlack: "#666666", brightRed: "#d54e53", brightGreen: "#b9ca4a",
                        brightYellow: "#e7c547", brightBlue: "#7aa6da", brightMagenta: "#c397d8",
                        brightCyan: "#70c0b1", brightWhite: "#eaeaea"
                    }
                });
                this.term.loadAddon(this.fitAddon);
                this.term.open(this.terminalEl);

                // 关键修改1：延迟执行fit，确保容器尺寸已计算
                setTimeout(() => {
                    try {
                        this.fitAddon.fit();
                    } catch (e) {
                        console.warn("fitAddon执行失败:", e);
                    }
                }, 50); // 短延迟确保DOM渲染完成

                this.term.onData((data) => this.sendInput(data));
                this.term.onResize(() => this.sendResize());
            }

            connect() {
                this.updateStatus('', '连接中…');
                const wsURL = `${wsScheme}//${location.host}${prefix}/ws?sid=${this.sid}`;
                console.log("发起WS连接：", wsURL);
                this.ws = new WebSocket(wsURL);
                this.ws.binaryType = "arraybuffer";

                this.connectTimer = setTimeout(() => {
                    if (this.ws.readyState === WebSocket.CONNECTING) {
                        this.ws.close();
                        this.updateStatus('offline', '连接超时');
                    }
                }, 30000);

                this.ws.onopen = () => {
                    clearTimeout(this.connectTimer);
                    this.updateStatus('online', '已连接');
                    this.sendResize();
                    this.term.focus();
                };
                this.ws.onmessage = (ev) => {
                    if (typeof ev.data === "string") this.term.write(ev.data);
                    else this.term.write(new Uint8Array(ev.data));
                };
                this.ws.onclose = () => {
                    clearTimeout(this.connectTimer);
                    clearInterval(this.heartbeatTimer);
                    this.updateStatus('offline', '连接已断开');
                    this.term.write("\r\n\x1b[33m[fnTerm] 连接已断开，点击\"重连\"恢复会话。\x1b[0m\r\n");
                };
                this.ws.onerror = (e) => {
                    clearTimeout(this.connectTimer);
                    console.error("WS连接错误", e);
                    this.updateStatus('offline', '连接错误');
                };
                this.heartbeatTimer = setInterval(() => {
                    this.sendCmd("2", 'live');
                }, 25000);
            }

            sendInput(data) {
                this.sendCmd("0", data);
            }

            sendResize() {
                this.sendCmd("1", JSON.stringify({cols: this.term.cols, rows: this.term.rows}));
            }

            // 统一发送工具函数
            sendCmd(type, payload) {
                console.log('发送命令', this.sid, '几点回家复活甲', this.ws)
                if (this.ws?.readyState !== WebSocket.OPEN) return;
                const buf = new TextEncoder().encode(type + this.sid + payload);
                this.ws.send(buf);
            }

            handleResize() {
                clearTimeout(this.resizeTimer);
                this.resizeTimer = setTimeout(() => {
                    try {
                        this.fitAddon.fit();
                    } catch (e) {
                    }
                    this.sendResize();
                }, 120);
            }

            updateStatus(state, text) {
                const statusEl = document.getElementById('status');
                const statusText = document.getElementById('status-text');
                this.tabElement.setAttribute('data-status', state);
                if (activeTabId === this.sid) {
                    statusEl.className = state;
                    statusText.textContent = text;
                }
            }

            activate() {
                document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
                document.querySelectorAll('.term-wrap').forEach(el => el.classList.remove('active'));
                this.tabElement.classList.add('active');
                this.termElement.classList.add('active');
                activeTabId = this.sid;
                const statusEl = document.getElementById('status');
                const statusText = document.getElementById('status-text');
                statusEl.className = this.tabElement.dataset.status;
                statusText.textContent = this.tabElement.dataset.status === '' ? '连接中…' : this.tabElement.dataset.status === 'online' ? '已连接' : '连接断开';

                // 关键修改2：切换Tab时重新适配尺寸
                if (this.term) {
                    this.term.focus();
                    setTimeout(() => {
                        this.fitAddon.fit();
                        this.sendResize(); // 同步告知服务端新的尺寸
                    }, 30);
                }
            }

            reconnect() {
                if (this.ws) this.ws.close();
                clearTimeout(this.connectTimer);
                clearInterval(this.heartbeatTimer);
                this.connect();
            }

            clearScreen() {
                if (this.term) this.term.clear();
            }
        }

        function createNewTab() {
            const tab = new TerminalTab();
            tabs.set(tab.sid, tab);
            tab.activate();
            // 新建后自动滚动到最右侧
            const scrollWrap = document.querySelector('.tabs-scroll-wrap');
            setTimeout(() => {
                scrollWrap.scrollLeft = scrollWrap.scrollWidth;
            }, 10);
        }

        document.getElementById('new-tab-btn').addEventListener('click', createNewTab);
        document.getElementById('btn-clear').addEventListener('click', () => {
            if (!activeTabId) return;
            tabs.get(activeTabId).clearScreen();
        });
        document.getElementById('btn-reconnect').addEventListener('click', () => {
            if (!activeTabId) return;
            tabs.get(activeTabId).reconnect();
        });

        // 等待DOM完全加载后再创建第一个Tab
        document.addEventListener('DOMContentLoaded', () => {
            // 额外延迟确保容器尺寸稳定
            setTimeout(createNewTab, 100);
        });
        window.addEventListener('resize', () => {
            const active = tabs.get(activeTabId);
            if (active) active.handleResize();
        });
    })();
</script>
</body>
</html>
